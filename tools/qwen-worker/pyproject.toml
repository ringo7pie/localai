[project]
name = "qwen-worker"
version = "0.1.0"
description = "Local Qwen worker exposed to Claude Code and Codex over MCP (stdio)"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_worker"]
