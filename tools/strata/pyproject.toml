[project]
name = "stra"
version = "0.1.0"
description = "Strata（MoE の CPU-GPU 分担推論エンジン）をこの A30 サーバーで動かすための CLI（標準ライブラリのみに依存）"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stra"]
